<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Registro de Alumnos</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <header class="top-bar">
      <div class="heading-text">
        <h1>Registro de Alumnos</h1>
        <p class="description">Gestiona la asistencia, inasistencia y notas de tus estudiantes con una interfaz clara y moderna.</p>
      </div>
      <button class="secondary logout-button" onclick="logout()">Cerrar Sesión</button> <a href="reportes.html"><button class="secondary">Ver Reportes</button></a>
    </header>

    <section class="card" id="panelBuscar">
      <div class="form-row">
        <input type="text" id="buscar" placeholder="Buscar alumno...">
        <button class="primary" onclick="buscarAlumno()">Buscar</button>
      </div>
    </section>

    <section class="card">
      <div id="panelAsistencia">
        <p id="seleccionInfo">Selecciona un alumno y una materia para registrar asistencia.</p>
        <button class="primary" onclick="sumarFalta(true)">Presente</button>
        <button class="secondary" onclick="sumarFalta(false)">Ausente</button>
      </div>
      <div id="panelNota" style="margin-top: 18px;">
        <input type="number" id="nota" placeholder="Nota" min="0" max="10" step="0.1">
        <button class="secondary" id="btnNota" onclick="agregarNota()">Agregar Nota</button>
      </div>
    </section>

    <section class="card">
      <div class="form-row" style="justify-content: flex-start; align-items: center; gap: 16px;">
        <div>
          <h2>Lista de Alumnos</h2>
        </div>
      </div>
      <div class="table-container">
        <table id="tabla" border="0">
          <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Materia</th>
            <th>Registro de Asistencias</th>
            <th>Nota</th>
            <th>Acción</th>
          </tr>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="datos.js"></script>
  <script src="script.js"></script>
</body>
</html>
