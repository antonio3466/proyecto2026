<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="login-page">
    <div class="login-box">
      <div class="login-header">
        <h1>Iniciar Sesión</h1>
        <p>Accede al sistema de registro con tu usuario y contraseña.</p>
      </div>

      <form onsubmit="event.preventDefault(); login();">
        <label>
          Usuario
          <input type="text" id="usuario" placeholder="Usuario" autocomplete="username">
        </label>

        <label>
          Contraseña
          <div class="password-wrapper">
            <input type="password" id="clave" placeholder="Contraseña" autocomplete="current-password">
            <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Mostrar contraseña">👁️</button>
          </div>
        </label>

        <button type="submit" class="primary">Ingresar</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="login.js"></script>
</body>
</html>
